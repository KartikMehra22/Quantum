[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-shot-quantum-regression"
version = "1.0.0"
description = "A reproducible semester study of ordinary and ridge regression on finite-shot two-qubit features."
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5", "scipy==1.16.3", "scikit-learn==1.7.2", "matplotlib==3.10.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

