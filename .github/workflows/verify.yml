name: Verify semester experiment
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Complete technical verification
        run: python scripts/verify_project.py --report results/ci_project_verification.json
      - name: Upload verification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: technical-verification
          path: results/ci_project_verification.json
