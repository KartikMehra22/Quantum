name: Verify semester experiment
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/check_results.py
      - run: python scripts/deep_audit.py --deep-physics
      - run: python scripts/run_study.py --output results/ci_reproduction
      - run: python scripts/compare_runs.py results/semester results/ci_reproduction
      - run: python scripts/audit_extension.py --deep-physics
      - run: python scripts/run_extension.py --output results/ci_extension_reproduction
      - run: python scripts/compare_extension_runs.py results/measurement_extension results/ci_extension_reproduction
